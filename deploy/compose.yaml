# Skywave website on a local server. Run deploy/setup.sh once; updates then arrive from GitHub by themselves.
name: skywave-website

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: skywave-website-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      DB_HOST: db
      DB_NAME: skywave_db
      DB_USER: skywave_web
      DB_PASS: ${DB_PASS:?set in deploy/.env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-support@skywavetech.co.zm}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # The site files are this git checkout, read-only: an update is visible at once
      - ..:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: skywave_db
      MARIADB_USER: skywave_web
      MARIADB_PASSWORD: ${DB_PASS:?set in deploy/.env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?set in deploy/.env}
    volumes:
      - db-data:/var/lib/mysql
      # First start only: creates the bookings table
      - ../app/database/skywave_db.sql:/docker-entrypoint-initdb.d/10-skywave.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No port published: only the website container reaches the database

volumes:
  db-data:
