<VirtualHost *:80>
    ServerAdmin support@skywavetech.co.zm
    DocumentRoot /var/www/html
    ServerTokens Prod
    ServerSignature Off

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve the repository's working files, the database dump or the server settings
    RedirectMatch 404 ^/(\.git|\.github|\.playwright-mcp|graphify-out|docs|deploy|app/database|app/config)(/|\.php|$)
    RedirectMatch 404 /\.(env|gitignore|htaccess)$
    RedirectMatch 404 ^/(README|SECURITY)\.md$

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
